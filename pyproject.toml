[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devterminal"
version = "2.0.0"
description = "Intelligent cross-platform terminal with smart features for developers"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Code-Dev"}]
requires-python = ">=3.7"
dependencies = [
    "prompt_toolkit",
    "rich",
    "colorama",
    "pygments",
    "psutil" 
]

[project.scripts]
devterminal = "devcli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["devcli*"]

[tool.setuptools.package-data]
"*" = ["*.md", "LICENSE"]